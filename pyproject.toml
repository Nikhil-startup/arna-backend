[project]
name = "arna-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikhil-startup", email = "pingalisainikhil00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
start = "arna_backend.main:start"
arna-backend = "arna_backend.main:start"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
